{{- $appSecretName := include "journiv.appSecretName" . -}}
{{- $postgresSecretName := include "journiv.postgresSecretName" . -}}
{{- $needsPostgresPassword := or .Values.postgresql.enabled (not (or .Values.config.postgres.secretName .Values.config.postgres.connectionStringSecretName)) -}}
{{- $needsConnectionString := and (not .Values.config.postgres.connectionStringSecretName) .Values.config.postgres.connectionString -}}
{{- if not .Values.config.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appSecretName }}
  labels:
    app: journiv
type: Opaque
data:
  SECRET_KEY: {{ include "journiv.appSecretValue" . | b64enc | quote }}
{{ end }}
{{- if and (not .Values.config.postgres.existingSecret) (or $needsPostgresPassword $needsConnectionString) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $postgresSecretName }}
type: Opaque
data:
  {{- if $needsPostgresPassword }}
  POSTGRES_PASSWORD: {{ include "journiv.postgresPasswordValue" . | b64enc | quote }}
  {{- end }}
  {{- if $needsConnectionString }}
  {{ .Values.config.postgres.connectionStringSecretKey | default "DATABASE_URL" }}: {{ .Values.config.postgres.connectionString | b64enc | quote }}
  {{- end }}
{{ end }}
