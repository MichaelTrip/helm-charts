{{- $appSecretName := include "journiv.appSecretName" . -}}
{{- $postgresSecretName := include "journiv.postgresSecretName" . -}}
{{- if not .Values.config.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appSecretName }}
  labels:
    app: journiv
type: Opaque
data:
  SECRET_KEY: {{ include "journiv.appSecretValue" . | b64enc | quote }}
{{ end }}
{{- if not .Values.config.postgres.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $postgresSecretName }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ include "journiv.postgresPasswordValue" . | b64enc | quote }}
  {{- if and (not .Values.config.postgres.connectionStringSecretName) .Values.config.postgres.connectionString }}
  {{ .Values.config.postgres.connectionStringSecretKey | default "DATABASE_URL" }}: {{ .Values.config.postgres.connectionString | b64enc | quote }}
  {{- end }}
{{ end }}
